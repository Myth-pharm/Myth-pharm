<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYTH Products</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    color: #222;
}

.header {
    background: #111;
    color: white;
    text-align: center;
    padding: 28px 15px;
}

.header h1 {
    margin: 0;
    font-size: 32px;
    letter-spacing: 2px;
}

.header p {
    margin: 8px 0 0;
    font-size: 15px;
}

.container {
    max-width: 600px;
    margin: 25px auto;
    padding: 0 15px;
}

.product {
    background: white;
    border-radius: 15px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.product h2 {
    margin-top: 0;
    font-size: 22px;
}

.price {
    font-size: 25px;
    font-weight: bold;
    margin: 15px 0;
}

.info {
    line-height: 1.8;
    color: #555;
}

.footer {
    text-align: center;
    padding: 25px;
    color: #777;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="header">
    <h1>MYTH</h1>
    <p>MYTH Products</p>
</div>

<div class="container">

    <div class="product">
        <h2>MYTH Hair Lotion</h2>

        <div class="info">
            120 ml
        </div>

        <div class="price">
            السعر: 299 EGP
        </div>

        <div class="info">
            لوشن للعناية بالشعر وتقليل تساقط الشعر.
        </div>
    </div>

</div>

<div class="footer">
    © MYTH Products
</div>

</body>
</html>
